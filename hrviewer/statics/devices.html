<!DOCTYPE html>
<html lang="de">
<head>

  <title>Geräte</title>
  <link rel="icon" type="image/png" sizes="32x32" href="xyou_chai_32.png" />
  <link rel="stylesheet" href="dashboard.css" />

</head>
<body>

  </header>

  <main id="board"></main>

  <script src="devices.config.js"></script>
  <script src="devices.js"></script>
